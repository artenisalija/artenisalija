name: Refresh AI & Automation section

on:
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC
  workflow_dispatch: {}
  repository_dispatch:
    types: [refresh-automations]
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/refresh-automations.yml'
      - '.github/scripts/refresh_automations.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh README block
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/refresh_automations.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes to README — exiting."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh AI & Automation section"
          git push
